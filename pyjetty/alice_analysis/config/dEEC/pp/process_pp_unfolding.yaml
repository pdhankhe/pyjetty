    pt_bins_reported: [20, 40, 60, 80]
    max_reg_param: 10
    plot_overlay_list:
      - ['config1', 'config2', 'config3']

  # config1:
  #   trk_thrd: 0.5

  config2:
    trk_thrd: 1.0

  # config3:
  #   trk_thrd: 0.15


# Observable block
corr_charge:

