# Configuration for:
#   (a) Processing of ROOT trees into histograms
#   (b) Analysis of histograms into final result
#
# The observables are structured into observable blocks (e.g. theta_g, subjet_z, etc.)
# each containing multiple individual subconfigurations (e.g. zcut, beta, subjetR, etc.),
# where each subconfiguration corresponds to a single unfolded result.
# One can also specify a list of jetR, which will be looped over.
#
# The process step is intended to loop over all observables simultaneously
# The analysis step is intended to run for a single observable block

# process_observables: ['jet_ENC_RL', 'jet_EEC_noweight_RL', 'jet_pt', 'corr_beg', 'corr_deltap', 'corr_deltapt', 'corr_deltapl', 'corr_charge', 'corr_rc', 'corr_energyweights', 'corr_end']
process_observables: ['corr_deltap', 'corr_deltapt', 'corr_deltapl', 'corr_charge', 'corr_energyweights']
jetR: [0.4] #, 0.5]
jet_matching_distance: 0.6        # Match jets with deltaR < jet_matching_distance*jetR
reject_tracks_fraction: 0.0
eta_max: 0.9
debug_level: 0
dry_run: False
fast_simulation: False
ENC_fastsim: False # only set to True when fast_simulation is set to True
ENC_pair_cut: False

# leadingtrack_pt_cut: 0.0



# Observable block
corr_deltap:

  common_settings:
    xtitle: '#it{R_{L}}'
    ytitle: '#Deltap'
    pt_bins_reported: [20, 40, 60, 80]
    max_reg_param: 10
    plot_overlay_list:
      - ['config1', 'config2', 'config3']

  # config1:
  #   trk_thrd: 0.5

  config2:
    trk_thrd: 1.0

  # config3:
  #   trk_thrd: 0.15


# Observable block
corr_deltapt:

  common_settings:
    xtitle: '#it{R_{L}}'
    ytitle: '#Deltap_{T}'
    pt_bins_reported: [20, 40, 60, 80]
    max_reg_param: 10
    plot_overlay_list:
      - ['config1', 'config2', 'config3']

  # config1:
  #   trk_thrd: 0.5

  config2:
    trk_thrd: 1.0

  # config3:
  #   trk_thrd: 0.15


